<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ST4R Network - Enlaces</title>
    <style>
        /* === RESET & CONFIGURACIÓN BÁSICA === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #050505; /* Estilo 'Very Black' */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* === ANIMACIÓN ELÉCTRICA DE FONDO === */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(27, 88, 160, 0.15) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
            animation: bg-flicker 5s infinite;
        }

        @keyframes bg-flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 22%, 24%, 55% { opacity: 0.2; }
        }

        .container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            z-index: 1;
        }

        /* === LOGO ST4R NETWORK === */
        header {
            text-align: center;
        }

        .logo {
            width: 220px;
            height: auto;
            /* Resplandor blanco sutil para el logo */
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
            animation: pulse-glow 3s infinite alternate;
        }

        @keyframes pulse-glow {
            from { filter: drop-shadow(0 0 5px rgba(255, 255, 255, 0.2)); }
            to { filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.7)); }
        }

        /* === CONTENEDOR DE ENLACES === */
        .links-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* === BOTONES ESTILO ELÉCTRICO === */
        .electric-btn {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 18px 20px;
            background-color: #0a0a0a;
            color: #fff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            border: 1px solid #1B58A0; /* Color base profundo */
            border-radius: 4px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 8px #1B58A0, inset 0 0 5px #1B58A0;
        }

        /* Efecto Hover general (Aumento de energía) */
        .electric-btn:hover {
            background-color: rgba(27, 88, 160, 0.1);
            border-color: #00e5ff;
            color: #00e5ff;
            box-shadow: 0 0 15px #00e5ff, 0 0 30px #1B58A0, inset 0 0 10px #00e5ff;
            text-shadow: 0 0 8px #00e5ff;
        }

        /* Rayos de luz recorriendo los bordes (Pseudo-elementos) */
        .electric-btn::before, 
        .electric-btn::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 2px;
            background: #00e5ff;
            box-shadow: 0 0 10px #00e5ff, 0 0 20px #00e5ff;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .electric-btn::before { top: 0; left: -100%; }
        .electric-btn::after { bottom: 0; right: -100%; }

        .electric-btn:hover::before {
            opacity: 1;
            animation: electric-strike-top 0.6s linear infinite;
        }
        .electric-btn:hover::after {
            opacity: 1;
            animation: electric-strike-bottom 0.6s linear infinite;
        }

        @keyframes electric-strike-top {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }
        @keyframes electric-strike-bottom {
            0% { right: -100%; }
            50%, 100% { right: 100%; }
        }

        /* === BOTÓN DESTACADO (CONVOCATORIA) === */
        /* Cambiamos la frecuencia eléctrica a un tono más agresivo (Ej: Amarillo/Dorado o Rojo) */
        .electric-btn.highlight {
            border-color: #ffaa00;
            box-shadow: 0 0 8px #ffaa00, inset 0 0 5px #ffaa00;
            margin-top: 15px; /* Separación extra para destacarlo */
        }

        .electric-btn.highlight:hover {
            background-color: rgba(255, 170, 0, 0.1);
            border-color: #ffea00;
            color: #ffea00;
            box-shadow: 0 0 15px #ffea00, 0 0 30px #ffaa00, inset 0 0 10px #ffea00;
            text-shadow: 0 0 8px #ffea00;
        }

        .electric-btn.highlight::before, 
        .electric-btn.highlight::after {
            background: #ffea00;
            box-shadow: 0 0 10px #ffea00, 0 0 20px #ffea00;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <img src="logo_star_network.png" alt="Logo ST4R Network" class="logo">
        </header>

        <main class="links-container">
            <a href="https://chat.whatsapp.com/E7BrJYjD1Tn4pm950ba4Sf" class="electric-btn" target="_blank" rel="noopener noreferrer">
                Comunidad WhatsApp
            </a>
            
            <a href="https://youtube.com/@st4rnetwork" class="electric-btn" target="_blank" rel="noopener noreferrer">
                Canal de YouTube
            </a>
            
            <a href="https://www.instagram.com/st4r.network?igsi=ZWZxMnlneXM2aWJx" class="electric-btn" target="_blank" rel="noopener noreferrer">
                Instagram
            </a>
            
            <a href="https://www.facebook.com/share/1EwS4oS5J5/" class="electric-btn" target="_blank" rel="noopener noreferrer">
                Facebook
            </a>
            
            <a href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=elQA_LskT06dYXP8peud85OgNcChkspCpUV1gAYLJqFUOTNDUDFWUzZRTVAxNFhOSDI4MFlSOU83RS4u" class="electric-btn highlight" target="_blank" rel="noopener noreferrer">
                Convocatoria STREET 001
            </a>
        </main>
    </div>

</body>
</html>
